name: Build and Upload Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build binaries
      run: make build-all

    - name: Upload arkd binaries
      uses: actions/upload-artifact@v4
      with:
        name: arkd-binaries
        path: |
          ./build/arkd-darwin-*
          ./build/arkd-linux-*
        if-no-files-found: error
        retention-days: 5
        compression-level: 6
        overwrite: true

    - name: Upload arkd wallet binaries
      uses: actions/upload-artifact@v4
      with:
        name: arkd-wallet-binaries
        path: ./build/arkd-wallet-*
        if-no-files-found: error
        retention-days: 5
        compression-level: 6
        overwrite: true

    - name: Upload arkd signer binaries
      uses: actions/upload-artifact@v4
      with:
        name: arkd-signer-binaries
        path: ./build/arkd-signer-*
        if-no-files-found: error
        retention-days: 5
        compression-level: 6
        overwrite: true

    - name: Upload ark cli binaries
      uses: actions/upload-artifact@v4
      with:
        name: ark-cli-binaries
        path: ./pkg/ark-cli/build
        if-no-files-found: error
        retention-days: 5
        compression-level: 6
        overwrite: true
