name: Trivy Security Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Scan
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build an image from Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arkd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never serve the runtime stage from cache. It runs apk upgrade, so a
          # cached layer pins whatever package versions were current when the
          # entry was written and the scan then reports CVEs against an image
          # staler than the one we ship: the release builds are uncached and do
          # pick the fixes up. The builder stage stays cached, which is where
          # the time goes.
          no-cache-filters: runtime

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          # avoid GHCR rate limits, see https://github.com/aquasecurity/trivy-db/pull/440 and https://github.com/aquasecurity/trivy-action/issues/389
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: "arkd:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
