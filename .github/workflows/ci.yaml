name: ci

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER_LABEL == '' }}

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected after running go mod tidy"
            git diff
            exit 1
          fi

      - name: Check e2e shard lists
        run: make check-e2e-shards

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout 5m --tests=false

      - name: gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: '-severity high -quiet -exclude=G115 -exclude-generated ./...'

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.50.0
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

      - name: buf breaking
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Compare against the target branch using the local checkout. A remote
          # https input would make buf run its own unauthenticated git clone,
          # which cannot read this private repository.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          buf breaking --against ".git#ref=origin/$BASE_REF" \
            --path api-spec/protobuf/ark/v1/indexer.proto \
            --path api-spec/protobuf/ark/v1/service.proto

  unit:
    name: unit
    needs: check
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER_LABEL == '' }}

      - name: arkd unit tests
        run: make test

      - name: Packages unit tests
        run: make test-pkg

  binaries:
    name: binaries
    needs: check
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER_LABEL == '' }}

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make build-all

      - name: Pack binaries
        run: tar -czf binaries.tgz build pkg/ark-cli/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: binaries.tgz
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  images:
    name: images
    needs: binaries
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries

      - name: Unpack binaries
        run: tar -xzf binaries.tgz

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build arkd image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./ci.Dockerfile
          target: arkd
          platforms: linux/amd64,linux/arm64
          provenance: false
          no-cache: true
          tags: arkd:ci
          outputs: type=oci,dest=arkd.oci.tar

      - name: Build arkd-wallet image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./ci.Dockerfile
          target: arkd-wallet
          platforms: linux/amd64,linux/arm64
          provenance: false
          no-cache: true
          tags: arkd-wallet:ci
          outputs: type=oci,dest=arkd-wallet.oci.tar

      - name: Build arkd-signer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./ci.Dockerfile
          target: arkd-signer
          platforms: linux/amd64,linux/arm64
          provenance: false
          no-cache: true
          tags: arkd-signer:ci
          outputs: type=oci,dest=arkd-signer.oci.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            arkd.oci.tar
            arkd-wallet.oci.tar
            arkd-signer.oci.tar
          if-no-files-found: error
          retention-days: 5

  integration-shard:
    name: integration (${{ matrix.shard }})
    needs: images
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ARKD_IMAGE: arkd:ci
      ARKD_WALLET_IMAGE: arkd-wallet:ci
      ARKD_SIGNER_IMAGE: arkd-signer:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER_LABEL == '' }}

      - uses: ./.github/actions/load-images

      - name: Run Nigiri
        uses: vulpemventures/nigiri-github-action@7fc63cec40cbfc113589a9ade24ab21c9107ad39 # v1
        with:
          use_liquid: false

      - name: Wait for Nigiri
        run: timeout 120 bash -c 'until curl -sf --max-time 5 -o /dev/null http://127.0.0.1:3000/blocks/tip/height; do sleep 1; done'

      - name: Run arkd, arkd-wallet and arkd-signer
        run: make docker-run DOCKER_UP_FLAGS=--no-build

      - name: Run test
        run: make integrationtest ARKD_E2E_SHARD=${{ matrix.shard }}

      # arkd fails whenever any of its dependencies does, so its own log usually
      # only shows the symptom. Capturing the whole stack is what distinguishes
      # a genuine test failure from a dependency that never came up.
      - name: Capture container state
        if: failure()
        run: |
          echo "=== Compose services ==="
          docker compose -f docker-compose.regtest.yml ps --all || true
          for c in arkd arkd-wallet arkd-signer nbxplorer pg redis bitcoin electrs chopsticks; do
            echo "=== $c ==="
            docker logs --tail 300 "$c" 2>&1 || echo "(container not present)"
          done

      - name: Tear down
        if: always()
        run: make docker-stop

      - name: Stop Nigiri
        if: always()
        run: nigiri stop --delete

  integration:
    name: integration
    needs: integration-shard
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Check shard results
        env:
          RESULT: ${{ needs.integration-shard.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "integration shards: $RESULT"
            exit 1
          fi

  trivy:
    name: trivy
    needs: images
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/load-images

      - name: Scan arkd
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # avoid GHCR rate limits, see https://github.com/aquasecurity/trivy-db/pull/440 and https://github.com/aquasecurity/trivy-action/issues/389
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: arkd:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan arkd-wallet
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: arkd-wallet:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan arkd-signer
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: arkd-signer:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: publish
    needs: [binaries, unit, integration, trivy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
      # Semver: any "-" suffix (rc, alpha, beta) marks a prerelease, so an unexpected tag never moves GHCR latest.
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    outputs:
      version: ${{ needs.binaries.outputs.version }}
      arkd_digest: ${{ steps.digests.outputs.arkd }}
      arkd_wallet_digest: ${{ steps.digests.outputs.arkd_wallet }}
      arkd_signer_digest: ${{ steps.digests.outputs.arkd_signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}

      - name: Unpack binaries
        run: tar -xzf "$RUNNER_TEMP/binaries.tgz" -C "$RUNNER_TEMP"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images

      - uses: ./.github/actions/setup-skopeo

      - name: Resolve digests
        id: digests
        run: |
          {
            echo "arkd=sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/images/arkd.oci.tar" | sha256sum | cut -d' ' -f1)"
            echo "arkd_wallet=sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/images/arkd-wallet.oci.tar" | sha256sum | cut -d' ' -f1)"
            echo "arkd_signer=sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/images/arkd-signer.oci.tar" | sha256sum | cut -d' ' -f1)"
            echo "sha=sha-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" "${flags[@]}"
          gh release upload "$VERSION" --clobber "$RUNNER_TEMP"/build/* "$RUNNER_TEMP"/pkg/ark-cli/build/*

      - name: Configure AWS credentials (staging)
        if: vars.ECR_PUSH_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR (staging)
        if: vars.ECR_PUSH_ENABLED == 'true'
        id: ecr-staging
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # unset-current-credentials discards the staging credentials first. Without
      # it the action would role-chain from staging into the prod role rather than
      # requesting a fresh OIDC token, and staging has no permission to do so.
      - name: Configure AWS credentials (prod)
        if: vars.ECR_PUSH_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: eu-central-1
          unset-current-credentials: true

      - name: Login to Amazon ECR (prod)
        if: vars.ECR_PUSH_ENABLED == 'true'
        id: ecr-prod
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push images to ECR
        if: vars.ECR_PUSH_ENABLED == 'true'
        env:
          STAGING_REGISTRY: ${{ steps.ecr-staging.outputs.registry }}
          PROD_REGISTRY: ${{ steps.ecr-prod.outputs.registry }}
          SHA_TAG: ${{ steps.digests.outputs.sha }}
        run: |
          for name in arkd arkd-wallet arkd-signer; do
            for dest in "$STAGING_REGISTRY/$name-staging" "$PROD_REGISTRY/$name-prod"; do
              for tag in "$VERSION" "$SHA_TAG"; do
                skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/images/$name.oci.tar" "docker://$dest:$tag"
              done
            done
          done

      - name: Login to GitHub Container Registry
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && env.PRERELEASE == 'false'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && env.PRERELEASE == 'false'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          wallet="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arkd-wallet"
          signer="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arkd-signer"
          for tag in "$VERSION" latest; do
            skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/images/arkd.oci.tar" "docker://$repo:$tag"
            skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/images/arkd-wallet.oci.tar" "docker://$wallet:$tag"
            skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/images/arkd-signer.oci.tar" "docker://$signer:$tag"
          done

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && env.PRERELEASE == 'false'
        with:
          version: 1.50.0
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish protos
        if: vars.PUBLIC_RELEASE_ENABLED == 'true' && env.PRERELEASE == 'false'
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push api-spec/protobuf --error-format github-actions --create --git-metadata

      - name: Summary
        env:
          ARKD_DIGEST: ${{ steps.digests.outputs.arkd }}
          ARKD_WALLET_DIGEST: ${{ steps.digests.outputs.arkd_wallet }}
          ARKD_SIGNER_DIGEST: ${{ steps.digests.outputs.arkd_signer }}
          SHA_TAG: ${{ steps.digests.outputs.sha }}
        run: |
          {
            echo "### Published $VERSION"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| \`arkd\` | \`$ARKD_DIGEST\` |"
            echo "| \`arkd-wallet\` | \`$ARKD_WALLET_DIGEST\` |"
            echo "| \`arkd-signer\` | \`$ARKD_SIGNER_DIGEST\` |"
            echo ""
            echo "Tags: \`$VERSION\`, \`$SHA_TAG\`. Prerelease: \`$PRERELEASE\`."
          } >> "$GITHUB_STEP_SUMMARY"
