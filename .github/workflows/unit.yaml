name: ci_unit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-go-sync:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check for changes
        run: |
          go mod tidy
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected after running go mod tidy"
            git diff
            exit 1
          fi

  test:
    name: unit tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: check linting
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          args: --timeout 5m --tests=false

      - name: check code integrity
        uses: securego/gosec@master
        with:
          args: '-severity high -quiet -exclude=G115 ./...'

      - name: Arkd unit tests
        run: make test

      - name: Packages unit tests
        run: make test-pkg
