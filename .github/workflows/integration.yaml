name: ci_integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: postgres/redis
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER_LABEL == '' }}

      - name: Run Nigiri
        uses: vulpemventures/nigiri-github-action@v1
        with:
          use_liquid: false

      - name: Run Arkd and Arkd Wallet
        run: make docker-run

      - name: Run test
        run: make integrationtest

      # arkd fails whenever any of its dependencies does, so its own log usually
      # only shows the symptom. Capturing the whole stack is what distinguishes
      # a genuine test failure from a dependency that never came up.
      - name: Capture container state
        if: failure()
        run: |
          echo "=== Compose services ==="
          docker compose -f docker-compose.regtest.yml ps --all || true
          for c in arkd arkd-wallet nbxplorer pg redis; do
            echo "=== $c ==="
            docker logs --tail 300 "$c" 2>&1 || echo "(container not present)"
          done

      - name: Tear down
        if: always()
        run: make docker-stop

      - name: Stop Nigiri
        if: always()
        run: nigiri stop --delete
