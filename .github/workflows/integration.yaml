name: ci_integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.env_name }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # sqlite/badger only on master merges, PRs run postgres/redis only
        include: ${{ github.event_name == 'push' && fromJSON('[{"env_target":"docker-run","env_name":"postgres/redis"},{"env_target":"docker-run-light","env_name":"sqlite/badger"}]') || fromJSON('[{"env_target":"docker-run","env_name":"postgres/redis"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Run Nigiri
        uses: vulpemventures/nigiri-github-action@v1
        with:
          use_liquid: false

      - name: Run Arkd and Arkd Wallet
        run: make ${{ matrix.env_target }}

      - name: Run test
        run: make integrationtest

      # arkd fails whenever any of its dependencies does, so its own log usually
      # only shows the symptom. Capturing the whole stack is what distinguishes
      # a genuine test failure from a dependency that never came up.
      - name: Capture container state
        if: failure()
        run: |
          echo "=== Compose services ==="
          docker compose -f docker-compose.regtest.yml ps --all || true
          for c in arkd arkd-wallet nbxplorer pg redis; do
            echo "=== $c ==="
            docker logs --tail 300 "$c" 2>&1 || echo "(container not present)"
          done

      - name: Tear down
        if: always()
        run: make docker-stop

      - name: Stop Nigiri
        if: always()
        run: nigiri stop --delete
