server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ES modules need the right type or the browser refuses to execute them.
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    # Routing is hash-based, so there is nothing to rewrite: every path that is
    # not a real file is a mistake.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    # config.js is rendered per deployment; never let a proxy hold onto it.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
}
